  await loadImages([...icons, ['vargas','../assets/fotos/vargas.jpg'], ['pedro1','../assets/fotos/pedro1.jpg'], ['leopoldina','../assets/fotos/leopoldina.jpg']]);
  makeTextures(); buildGeo(); SCENE = buildScene();
  window.READY = true;
})().catch(e => { window.ERR = String(e.stack || e); });
</script></body></html>
