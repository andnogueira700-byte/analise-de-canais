<!doctype html><html><body style="margin:0"><script src="three.min.js"></script><script src="GLTFLoader.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(640,400);document.body.appendChild(R.domElement);R.outputEncoding=THREE.sRGBEncoding;
window.show=async(name,az=.7,el=.35)=>new Promise(res=>{const sc=new THREE.Scene();sc.background=new THREE.Color(0x4a5058);sc.add(new THREE.HemisphereLight(0xffffff,0x555555,1.3));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(5,10,7);sc.add(dl);
 new THREE.GLTFLoader().load('models/'+name,g=>{const o=g.scene;let tris=0,meshes=0;o.traverse(c=>{if(c.isMesh){meshes++;const ge=c.geometry;tris+=(ge.index?ge.index.count:ge.attributes.position.count)/3;}});
  const b=new THREE.Box3().setFromObject(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());sc.add(o);const r=Math.max(s.x,s.y,s.z);
  const cam=new THREE.PerspectiveCamera(35,1.6,r/100,r*20);cam.position.set(c.x+Math.cos(az)*r*1.7,c.y+Math.sin(el)*r*1.2,c.z+Math.sin(az)*r*1.7);cam.lookAt(c);R.render(sc,cam);
  res({name,tris:Math.round(tris),meshes,size:[s.x,s.y,s.z].map(v=>+v.toFixed(2)),anims:g.animations.length,img:R.domElement.toDataURL('image/jpeg',.85).slice(23)});},undefined,e=>res({name,err:String(e)}));});
window.READY=true;
</script></body></html>
